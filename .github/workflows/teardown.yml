name: Teardown PDA Azure environment

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "delete" to confirm resource group deletion
        required: true
        default: ''

permissions:
  id-token: write
  contents: read

concurrency:
  group: pda-production
  cancel-in-progress: false

jobs:
  teardown:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      PDA_NAME_PREFIX: ${{ vars.PDA_NAME_PREFIX }}
      PDA_DELETE_CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Select subscription
        shell: pwsh
        run: ./scripts/Connect-Azure.ps1

      - name: Remove infrastructure
        shell: pwsh
        run: ./scripts/Remove-Infrastructure.ps1
