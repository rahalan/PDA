<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cumulus Granitus · Chat</title>
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("theme");
        const theme =
          (param === "dark" || param === "light")
            ? param
            : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./chat.js"></script>
  </head>
  <body data-page="chat">
    <div class="shell">
      <header class="topbar" aria-label="Primary">
        <div class="brand">
          <div class="brand-mark">CG</div>
          <div>
            <div class="brand-name">Cumulus Granitus</div>
            <div class="brand-note">Hardened clouds · governed agents</div>
          </div>
        </div>
        <nav class="toplinks" aria-label="Views">
          <a href="./index.html" aria-current="page">Chat</a>
          <a href="./admin.html">Admin</a>
          <a href="./compliance.html">Compliance</a>
        </nav>
      </header>

      <main class="page page--wide chat-workspace">
        <section class="panel panel--solid chat-panel">
          <div class="panel-head chat-panel__head">
            <div>
              <h1>Cairn</h1>
              <p class="lede">Guidance set in stone.</p>
            </div>
            <div class="chat-header-actions">
              <div id="chatMeta" class="meta"></div>
              <button type="button" id="newChatButton" class="ghost">New chat</button>
            </div>
            <div class="chat-conversation-state">
              <div id="chatBadges" class="badge-row" aria-label="Current protection" aria-live="polite"></div>
            </div>
          </div>

          <div id="chatAlerts" class="alert-stack" aria-live="polite"></div>
          <div id="chatTranscript" class="transcript" aria-live="polite"></div>

          <form id="chatForm" class="composer">
            <label class="sr-only" for="promptInput">Prompt</label>
            <textarea id="promptInput" name="prompt" rows="5" placeholder="Ask about a shipment, plant issue, supplier, or customer decision." autocomplete="off"></textarea>
            <div class="composer-actions">
              <button type="submit" class="primary" id="sendButton">Send</button>
            </div>
          </form>
        </section>

        <aside class="panel panel--solid demo-sidebar" aria-labelledby="demoRunnerTitle">
          <div class="demo-sidebar__head">
            <p class="eyebrow">Presenter controls</p>
            <h2 id="demoRunnerTitle">Demo stories</h2>
          </div>
          <div class="demo-runner" id="demoRunner">
            <div class="demo-runner__body">
              <div class="field-row">
                <select id="demoStorySelect" aria-label="Demo story"></select>
              </div>
              <div class="demo-runner__brief">
                <span class="demo-runner__world">Cumulus Granitus · Fictional industrial automation manufacturer</span>
                <strong id="demoStoryPersona"></strong>
                <span id="demoStoryScenario" class="note"></span>
              </div>
              <div class="demo-runner__status">
                <strong id="demoStepTitle">Ready</strong>
                <span id="demoProgress" class="note">0 of 0</span>
              </div>
              <div class="button-row demo-runner__actions">
                <button type="button" id="demoNextButton">Next</button>
                <button type="button" id="demoAutoButton" class="primary">Auto</button>
                <button type="button" id="demoStopButton" disabled>Stop</button>
              </div>
            </div>
          </div>
        </aside>
      </main>
    </div>
  </body>
</html>
